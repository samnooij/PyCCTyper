[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyCCTyper"
version = "1.0.0"
authors = [
    { name="Sam Nooij", email="s.nooij@uu.nl" },
]
description = "PyCCTyper: Accelerated detection and subtyping of CRISPR-Cas"
keywords = ["bioinformatics", "CRISPR-Cas", "bacterial", "microbial", "genomics"]
readme = "README.md"
requires-python = ">=3.8, < 3.12"
dependencies = [
    "setuptools >= 81.0.0, < 82",
    "numpy >= 1.17.5, < 2",
    "pandas >= 1.3, < 2",
    "scipy >= 1.4.1",
    "biopython >= 1.76",
    "multiprocess >= 0.70.9",
    "scikit-learn >= 0.22.0",
    "xgboost >= 1.4, < 2",
    "tqdm >= 4",
    "drawSvg >= 1.8.0",
    "setuptools",
    "pyrodigal >= 3.7.1",
    "pyhmmer >= 0.12.1"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Development Status :: 4 - Beta",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
pycctyper = "pycctyper:main"
repeatType = "repeatType:main"
repeatTrain = "repeatTrain:main"

[project.urls]
Homepage = "https://github.com/samnooij/PyCCTyper"
Issues = "https://github.com/samnooij/PyCCTyper/issues"
Documentation = "https://samnooij.github.io/PyCCTyper"
Repository = "https://github.com/samnooij/PyCCTyper.git"
Changelog = "https://github.com//samnooij/PyCCTyper/blob/main/CHANGELOG.md"

[tool.black]
line-length = 79
